<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>界面样本室 · Product UI Craft</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fafaf7;--paper:#fff;--ink:#252620;--muted:#62645b;--line:#ddded6;--soft:#efefe9;--accent:#a43a1d;--art:#ee7046;--tint:#f8e9e2;--on:#fff;--focus:#136fc0;color-scheme:light;font-family:"DM Sans",Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
:root.dark{--bg:#191b19;--paper:#222521;--ink:#f3f3e9;--muted:#b6b9af;--line:#41463f;--soft:#30342f;--focus:#8bc6ff;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select{font:inherit;color:inherit}button,select,input[type=range],input[type=checkbox]{cursor:pointer}button{border:0;background:transparent;padding:0}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}h1,h2,h3,p,fieldset{margin:0}fieldset{padding:0;border:0;min-width:0}
header{border-bottom:1px solid var(--line);background:var(--paper)}.top{max-width:1480px;margin:auto;padding:0 clamp(20px,4vw,64px);display:flex;align-items:center;min-height:72px;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:730;letter-spacing:-.045em;font-size:21px;white-space:nowrap}.mark{width:26px;height:26px;position:relative;transform:rotate(-10deg)}.mark i{position:absolute;width:9px;height:22px;background:var(--ink);transform:skew(-22deg);top:2px}.mark i:first-child{left:3px}.mark i:last-child{left:15px;height:15px;top:9px;background:var(--art)}
.vline{border-left:1px solid var(--line);height:20px}.top-title{font-size:14px;color:var(--muted)}.right{margin-left:auto}.outline,.solid,.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:7px;min-height:38px;font-size:13px;font-weight:550}
.outline,.iconbtn{border:1px solid var(--line);background:var(--paper);padding:7px 13px}.outline:hover,.iconbtn:hover{background:var(--soft)}.iconbtn{min-width:38px;padding:7px}.solid{background:var(--accent);color:var(--on);padding:8px 16px}.solid:hover{filter:brightness(.93)}
main{max-width:1480px;margin:0 auto;padding:clamp(30px,4.2vw,64px) clamp(20px,4vw,64px) 50px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:clamp(34px,4.1vw,62px);letter-spacing:-.06em;line-height:1.08;font-weight:660}.intro p{margin-top:14px;color:var(--muted);font-size:14px}.nav{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px}.nav button{padding:10px 1px 13px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-size:14px}.nav button[aria-pressed=true]{border-color:var(--accent);color:var(--ink);font-weight:700}.nav button:hover{color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,2.55fr) minmax(250px,1fr);gap:22px;align-items:stretch}.borderbox{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden;min-width:0}.stage{display:flex;flex-direction:column}.bar{padding:11px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);min-height:44px}.bar-label{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:650}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}.poster{position:relative;isolation:isolate;flex:1;min-height:345px;overflow:hidden;background:#f0efe8;color:#292b26}.poster.grid{background-image:radial-gradient(#b6b6a9 0.75px,transparent .9px);background-size:12px 12px}.poster canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.poster-type{position:absolute;left:5.5%;top:10%;pointer-events:none}.poster-type small{display:block;letter-spacing:.08em;font-size:11px;font-weight:650}.poster-type strong{display:block;margin-top:8px;font:italic 500 clamp(34px,4.4vw,73px)/.94 Georgia,"Times New Roman",serif;letter-spacing:-.065em}.register{position:absolute;inset:auto 5.5% 8%;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.register i{width:18px;height:18px;background:linear-gradient(#686a60,#686a60) center/100% 1px no-repeat,linear-gradient(#686a60,#686a60) center/1px 100% no-repeat}.register span{font-size:11px;letter-spacing:.09em}
.panel{padding:20px 22px;display:flex;flex-direction:column;gap:17px}.panel h2,.samples h2,.scene-title{font-size:17px;font-weight:650;letter-spacing:-.02em}.panel-title{display:flex;align-items:center;justify-content:space-between}.panel-title button{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}.field{display:grid;gap:8px}.field>label,legend,.row-label{font-size:13px;font-weight:570}.label-line,.switchline{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.label-line output{font-size:12px;color:var(--muted)}.switchline{padding:4px 0}.rule{height:1px;background:var(--line)}input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:20px}.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.swatch{width:33px;height:33px;border-radius:50%;padding:4px;border:1px solid transparent;background:transparent}.swatch i{display:block;width:100%;height:100%;border-radius:50%;background:var(--sw)}.swatch[aria-pressed=true]{border-color:var(--ink)}
.toggle{appearance:none;width:36px;height:22px;margin:0;background:var(--muted);border-radius:22px;position:relative;flex:none}.toggle:after{content:'';position:absolute;background:#fff;border-radius:50%;width:16px;height:16px;top:3px;left:3px;transition:transform .16s}.toggle:checked{background:var(--accent)}.toggle:checked:after{transform:translateX(14px)}.dark .toggle:checked:after{background:#24251e}
.samples{margin-top:26px}.sample-list{margin-top:13px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sample{display:flex;align-items:center;text-align:left;gap:14px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);min-width:0;transition:border-color .16s}.sample:hover{border-color:var(--muted)}.sample[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 .5px var(--accent)}.sample canvas{background:#eeede6;width:76px;height:57px;border-radius:4px}.sample b,.sample small{display:block}.sample b{font-size:14px}.sample small{font-size:11px;color:var(--muted);letter-spacing:.02em}
.demo{padding:clamp(18px,3vw,42px);min-height:340px;display:flex;flex-direction:column;gap:17px;justify-content:center}.demo p,.hint{font-size:13px;color:var(--muted)}.demo input[type=text],.demo input[type=email],select,dialog input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 11px;min-height:40px}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.feedback{min-height:1.5em;color:var(--accent);font-size:13px}.invalid{border-color:var(--accent)!important}.choices,.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button,.choices button{border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px}.seg button[aria-pressed=true],.choices button[aria-pressed=true]{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.color-strip{display:flex;min-height:105px;border:1px solid var(--line);border-radius:7px;overflow:hidden}.color-strip div{flex:1;min-width:0;display:flex;align-items:end;padding:10px 6px;font-size:10px}.form-block{width:min(100%,440px);display:grid;gap:15px}.summary{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:8px}.summary strong{font-size:22px;font-variant-numeric:tabular-nums}.list{display:grid}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left}.record:hover{color:var(--accent)}.record span:last-child{font-size:12px;color:var(--muted)}.detail{padding:14px 16px;background:var(--soft);border-left:3px solid var(--accent);font-size:14px}.state{padding:20px;background:var(--soft);border-radius:7px;display:grid;gap:10px;justify-items:start}.state b{font-size:16px}.empty{font-size:14px;color:var(--muted);padding:14px 0}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(400px,calc(100% - 30px));box-shadow:0 18px 75px #0003}dialog::backdrop{background:#12181166}dialog form{display:grid;gap:16px}dialog h2{font-size:20px}.foot{border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;margin-top:32px;padding-top:13px;color:var(--muted);font-size:11px}.note{margin-top:auto;font-size:12px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1.8fr) minmax(225px,1fr);gap:14px}.panel{padding:16px}.sample canvas{width:56px}.sample{gap:8px}.poster{min-height:320px}}
@media(max-width:700px){main{padding:25px 16px 30px}.top{padding:0 16px;gap:12px;min-height:57px}.brand{font-size:18px}.top-title,.vline{display:none}.intro{margin-bottom:15px}.nav{justify-content:space-between;gap:4px;margin-bottom:16px}.nav button{font-size:13px}.layout{grid-template-columns:1fr}.poster{min-height:clamp(205px,55vw,320px)}.poster-type strong{font-size:clamp(31px,8.5vw,53px)}.panel{gap:14px}.sample-list{gap:6px}.sample{flex-direction:column;align-items:stretch;padding:6px}.sample span{padding:0 2px 2px}.sample canvas{width:100%;height:52px}.sample b{font-size:12px}.sample small{font-size:10px}.demo{min-height:260px}.samples{margin-top:19px}.color-strip div{font-size:9px;padding:5px 2px}}
@media(prefers-reduced-motion:reduce){*,*:after{transition:none!important;animation:none!important}}

/* Gallery navigation and live specimens */
:root{--bg:#f8f8f5;--ink:#222623;--muted:#646962;--line:#d7d9d0;--editorial:Georgia,"Songti SC",STSong,"Noto Serif CJK SC",serif}
::selection{background:var(--accent);color:var(--on)}
.top,main{max-width:1344px}.top{min-height:68px;gap:22px}.brand{font-weight:630;font-size:20px;letter-spacing:-.035em}.nav{margin:0 0 0 auto;gap:21px;border:0;align-self:stretch;align-items:stretch}.nav button{padding:10px 0;margin:0;font-size:13px}.nav button[aria-pressed=true]{border-color:var(--ink)}.right{margin-left:8px}.top .outline{border-radius:24px;font-size:12px;min-height:32px}
main{padding-top:34px}.intro{align-items:baseline;margin-bottom:24px}.intro h1{font:500 clamp(36px,3.7vw,56px)/1.24 var(--editorial);letter-spacing:-.035em}.intro p{margin:0;font-size:13px}
.shelf{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:clamp(24px,3vw,48px)}.feature,.side-samples{min-width:0}
.wave-print{position:relative;background:color-mix(in srgb,var(--art) 14%,var(--paper));height:clamp(260px,23vw,330px);overflow:hidden;border-radius:3px}
.wave-print canvas{width:100%;height:100%;display:block}.wave-print>span{position:absolute;left:20px;bottom:12px;color:var(--ink);font:italic 500 clamp(23px,2.15vw,34px)/1 var(--editorial);letter-spacing:-.035em;pointer-events:none}
.caption,.field-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.feature>.caption{padding-top:12px}.entry{font-weight:620;font-size:17px;display:inline-flex;align-items:center;gap:8px}.entry:after{content:'';width:7px;height:7px;display:inline-block;transform:rotate(-45deg);border-bottom:1.5px solid;border-right:1.5px solid;color:var(--muted)}.entry:hover{color:var(--accent)}.meta{font-size:12px;color:var(--muted)}
.mini-seg{display:flex;gap:1px;padding:2px;background:var(--soft);border-radius:6px}.mini-seg button{padding:4px 9px;border-radius:4px;font-size:12px;color:var(--muted)}.mini-seg button[aria-pressed=true]{color:var(--ink);background:var(--paper);box-shadow:0 1px 3px #0002}
.side-samples{display:grid;align-content:space-between;gap:22px}.plates{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;gap:3px}.plate{min-width:0;text-align:left}.plate i{display:block;height:clamp(62px,6vw,88px);position:relative}.plate[aria-pressed=true] i:after{content:'';position:absolute;right:9px;bottom:9px;width:9px;height:5px;border:solid #20231e;border-width:0 0 2px 2px;transform:rotate(-45deg)}.plate i:before{content:"";position:absolute;inset:0 0 auto;height:22%;border-top:6px solid var(--deep-tone);background:var(--light-tone)}.plate span{display:block;padding-top:5px;font-size:12px;color:var(--muted)}.plate[aria-pressed=true] span{color:var(--ink)}
.form-sample{border-top:1px solid var(--line);padding-top:15px}.form-sample .switchline,.field-line{min-height:42px;font-size:13px}.form-sample .caption{margin-bottom:5px}.field-line select{padding:4px 8px;min-height:32px;width:auto;font-size:12px;background:var(--paper)}.toggle{width:35px;height:21px}.toggle:after{width:15px;height:15px}
.reading{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}.reading-grid{display:grid;grid-template-columns:minmax(190px,.85fr) minmax(0,2.15fr);gap:clamp(15px,3vw,44px);margin-top:13px}.index-list{display:grid;align-content:center}.index-list button{text-align:left;padding:9px 12px;line-height:1.35;font-size:13px;color:var(--muted);border-radius:5px}.index-list button[aria-pressed=true]{background:var(--tint);color:var(--accent);font-weight:600}.excerpt{margin:0;padding:18px 22px;background:var(--paper);display:grid;align-content:center;gap:7px}.excerpt figcaption{font-size:12px;color:var(--muted)}.excerpt blockquote{margin:0;font:500 clamp(18px,1.65vw,25px)/1.52 var(--editorial);text-wrap:pretty}.foot{margin-top:24px}
.borderbox{border-radius:8px}.panel.borderbox{border:none;background:transparent;border-top:1px solid var(--line);border-radius:0;padding:15px 0 8px 4px}.layout{gap:clamp(22px,3.3vw,50px)}.poster-type strong{letter-spacing:-.035em}.poster.grid{background-image:radial-gradient(#c3c3b9 .6px,transparent .8px)}.detail{border-left:0;margin-top:8px}.sample{border-radius:6px}.demo{min-height:340px}
@media(max-width:800px){.top{gap:15px}.nav{gap:12px}.shelf{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}.side-samples{gap:14px}.wave-print{height:270px}.intro p{font-size:12px}}
@media(max-width:700px){.top{display:grid;grid-template-columns:1fr auto;gap:0;min-height:0;padding-top:12px}.top .right{grid-area:1/2}.brand{font-size:18px}.nav{grid-column:1/-1;grid-row:2;margin:5px 0 0;justify-content:space-between;gap:5px}.nav button{padding:10px 1px;min-height:42px}.intro{display:block;margin-bottom:16px}.intro h1{font-size:34px}.intro p{margin-top:6px}.shelf{grid-template-columns:1fr;gap:21px}.wave-print{height:clamp(170px,44vw,245px)}.side-samples{display:grid;gap:18px}.plate i{height:56px}.plates{margin-top:9px}.reading-grid{grid-template-columns:1fr;gap:8px}.excerpt{padding:16px}.entry{font-size:16px}.feature>.caption{padding-top:9px}.panel.borderbox{padding:14px 0}.reading{margin-top:21px}main{padding-top:20px}.form-sample .switchline,.field-line{min-height:44px}.mini-seg button{min-height:32px}.index-list button{min-height:42px}.excerpt blockquote{font-size:19px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span>Product UI Craft</div><nav class="nav" aria-label="样本分类">
<button data-page="overview" aria-pressed="true">总览</button><button data-page="visual" aria-pressed="false">视觉插件</button><button data-page="controls" aria-pressed="false">基础控件</button><button data-page="colors" aria-pressed="false">配色方案</button><button data-page="patterns" aria-pressed="false">界面模式</button>
</nav><button id="theme" class="outline right" type="button">深色模式</button></div></header>
<main><div class="intro"><h1 id="page-heading">界面样本室</h1><p id="page-description">选择一个样本，调整它的外观与行为</p></div>
<section id="overview" class="page" aria-label="样本总览">
<div class="shelf">
<article class="feature"><div class="wave-print"><canvas id="cover-art" role="img" aria-label="等距波场线条预览"></canvas><span id="cover-name" lang="en">Wave Field</span></div><div class="caption"><button class="entry" data-open="visual">视觉插件</button><div class="mini-seg" id="cover-picker" aria-label="选择视觉样本"></div></div></article>
<div class="side-samples">
<article class="palette-sample"><div class="caption"><button class="entry" data-open="colors">配色方案</button><span class="meta" id="scheme-name">赤陶</span></div><div id="palette-plates" class="plates" aria-label="切换配色"></div></article>
<article class="form-sample"><div class="caption"><button class="entry" data-open="controls">基础控件</button><span class="meta">通知设置</span></div><label class="switchline">接收项目更新<input id="preview-enable" class="toggle" type="checkbox" checked></label><label class="field-line" for="preview-frequency">发送频率<select id="preview-frequency"><option>每日摘要</option><option>每周汇总</option><option>每次更新</option></select></label></article>
</div></div>
<article class="reading"><div class="caption"><button class="entry" data-open="patterns">界面模式</button><span class="meta">主从详情</span></div><div class="reading-grid"><div class="index-list" id="preview-index"></div><figure class="excerpt"><figcaption id="excerpt-source"></figcaption><blockquote id="excerpt-copy"></blockquote></figure></div></article>
</section>
<section id="visual" class="page" aria-label="视觉插件" hidden>
<div class="layout"><div class="stage borderbox"><div class="bar"><span class="bar-label"><i class="dot"></i>实时画布</span><span id="size" class="mono"></span></div>
<div id="poster" class="poster"><canvas id="art" role="img" aria-label="折面构成实时图形"></canvas><div class="poster-type"><small id="art-cn">折面构成</small><strong id="art-en" lang="en">Fold<br>Study</strong></div><div class="register"><i></i><span class="mono" id="art-code">FORM / 01</span></div></div></div>
<aside class="panel borderbox"><div class="panel-title"><h2>插件参数</h2><button id="reset">重置</button></div><div class="rule"></div>
<fieldset><legend>主色</legend><div class="swatches" id="art-swatches"></div></fieldset>
<div class="field"><div class="label-line"><label for="density">细节密度</label><output for="density" id="density-val"></output></div><input type="range" id="density" min="12" max="72" value="44"></div>
<div class="field"><div class="label-line"><label for="angle">旋转角度</label><output for="angle" id="angle-val"></output></div><input type="range" id="angle" min="-90" max="90" value="-12"></div><div class="rule"></div>
<label class="switchline">参考点阵<input class="toggle" type="checkbox" id="grid"></label><label class="switchline">动态预览<input class="toggle" type="checkbox" id="motion"></label></aside></div>
<div class="samples"><h2>插件样本</h2><div class="sample-list" id="samples"></div></div></section>
<section id="controls" class="page" aria-label="基础控件" hidden></section><section id="colors" class="page" aria-label="配色方案" hidden></section><section id="patterns" class="page" aria-label="界面模式" hidden></section>
<div class="foot"><span>Product UI Craft</span><span>离线交互样本</span></div>
</main>
<dialog id="confirm"><form method="dialog"><h2>保存通知设置？</h2><p id="dialog-copy"></p><div class="line"><button class="outline" value="cancel" autofocus>返回修改</button><button class="solid" value="confirm">确认保存</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const palettes=[
 {name:'赤陶',art:'#E87B55',light:'#A43A1D',dark:'#FFAA8B',tint:'#F8E9E2',deep:'#472F27'},
 {name:'群青',art:'#587FD6',light:'#344FB2',dark:'#A8B9FF',tint:'#EAEDFB',deep:'#28324B'},
 {name:'苔绿',art:'#77935D',light:'#46633D',dark:'#ACD598',tint:'#E8EFE3',deep:'#283B25'},
 {name:'鸢紫',art:'#A181BF',light:'#72498F',dark:'#D9B3F4',tint:'#F2EAF7',deep:'#3C2D44'}
];
const plugins=[['折面构成','Fold Study','FORM'],['等距波场','Wave Field','WAVE'],['半调网点','Dot Matrix','DOTS']];
const state={plugin:0,palette:0,dark:false,phase:0,page:'overview'};
const reduced=matchMedia('(prefers-reduced-motion:reduce)');
function applyTheme(){
 const p=palettes[state.palette],d=state.dark,root=document.documentElement;
 root.classList.toggle('dark',d);
 for(const [key,value] of Object.entries({art:p.art,accent:d?p.dark:p.light,tint:d?p.deep:p.tint,on:d?'#201F1B':'#FFFFFF'}))root.style.setProperty('--'+key,value);
 $('scheme-name').textContent=p.name;
 $('theme').textContent=d?'浅色模式':'深色模式';
 document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.palette===state.palette)));
 if($('strip'))renderTokens();
 redraw();
}
function swatches(parent){
 palettes.forEach((p,index)=>{
 const b=document.createElement('button');b.className='swatch';b.dataset.palette=index;b.title=p.name;b.setAttribute('aria-label',p.name);b.innerHTML='<i aria-hidden="true"></i>';b.style.setProperty('--sw',p.art);
 b.onclick=()=>{state.palette=index;applyTheme()};parent.append(b);
 });
}
function fit(c){
 const rect=c.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return null;
 const dpr=Math.min(devicePixelRatio||1,2),pw=Math.round(w*dpr),ph=Math.round(h*dpr);
 if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
 const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return {ctx,w,h}
}
const TAU=2*Math.PI;
function shade(hex,f){return 'rgb('+[1,3,5].map(i=>Math.round(Math.min(255,parseInt(hex.slice(i,i+2),16)*f))).join(',')+')'}
function folded(ctx,n,phase,color){
 // Project a pleated torus and paint its faces from back to front
 const faces=[],rings=n*2,sides=24;
 function vertex(i,j){
 const u=i*TAU/rings,v=j*TAU/sides,crest=i%2===0?.09:-.045;
 const tube=.35+crest+.05*Math.cos(3*u+.4);
 const radius=.76+.13*Math.cos(3*u+.5)+tube*Math.cos(v);
 const x=radius*Math.cos(u),y=radius*Math.sin(u),z=tube*Math.sin(v)+.25*Math.sin(2*u+.55);
 const a=.58+.28*Math.sin(phase),b=.48+.22*Math.sin(phase*.72);
 const yy=y*Math.cos(a)-z*Math.sin(a),zz=y*Math.sin(a)+z*Math.cos(a);
 return [x*Math.cos(b)+zz*Math.sin(b),yy,zz*Math.cos(b)-x*Math.sin(b)];
 }
 const mesh=Array.from({length:rings},(_,i)=>Array.from({length:sides},(_,j)=>vertex(i,j)));
 for(let i=0;i<rings;i++)for(let j=0;j<sides;j++){
 const k=(i+1)%rings,l=(j+1)%sides,v=[mesh[i][j],mesh[k][j],mesh[k][l],mesh[i][l]];
 const [a,b,c]=v,ax=b[0]-a[0],ay=b[1]-a[1],az=b[2]-a[2],bx=c[0]-a[0],by=c[1]-a[1],bz=c[2]-a[2];
 const nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx,len=Math.hypot(nx,ny,nz)||1;
 const light=.62+.57*Math.max(0,(-nx*.45-ny*.62+nz*.65)/len);
 faces.push({v,z:v.reduce((sum,p)=>sum+p[2],0),fill:shade(color,light)});
 }
 faces.sort((a,b)=>a.z-b.z);
 for(const {v,fill} of faces){ctx.beginPath();v.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=ctx.strokeStyle=fill;ctx.lineWidth=.003;ctx.fill();ctx.stroke()}
}
function wave(ctx,n,phase,color){
 const lines=Math.round(n*1.8);
 for(let i=0;i<lines;i++){
  const v=i/(lines-1)*2-1;
  ctx.beginPath();
  for(let j=0;j<=150;j++){
   const u=j/75-1,angle=u*2.85+v*.63+phase;
   const x=u*1.18+v*.19*Math.cos(angle);
   const y=.31*Math.sin(angle*1.7)+.18*Math.cos(angle*.71)+v*(.25+.21*Math.cos(angle*1.6));
   if(j)ctx.lineTo(x,y);else ctx.moveTo(x,y);
  }
  ctx.lineWidth=.005;ctx.strokeStyle=shade(color,.47+.35*(v+1)/2);ctx.stroke();
 }
}
function halftone(ctx,n,phase,color){
 const step=2/(n*.52);
 for(let y=-1;y<=1;y+=step)for(let x=-1;x<=1;x+=step){
 const r=x*x+y*y;if(r>1)continue;
 const band=(1+Math.sin(7*x+3*Math.sin(3*y+phase)+phase))/2;
 ctx.beginPath();ctx.arc(x,y,step*(.12+.38*band)*Math.pow(1-r,.16),0,TAU);ctx.fillStyle=shade(color,.69+.36*band);ctx.fill();
 }
}
function paint(c,which,small){
 const result=fit(c);if(!result)return;
 const {ctx,w,h}=result,n=small?28:+$('density').value,phase=small?0:state.phase;
 const scale=small?Math.min(w*.39,h*.44):Math.min(w*.22,h*.395);
 ctx.save();ctx.translate(small?w*.5:w*.64,h*(small?.51:.49));ctx.rotate((small?-12:+$('angle').value)*Math.PI/180);ctx.scale(scale,scale);
 [folded,wave,halftone][which](ctx,n,phase,palettes[state.palette].art);ctx.restore();
 if(!small)$('size').textContent=Math.round(w)+' × '+Math.round(h);
}
function redraw(){
 if(state.page==='overview'){drawCover();return}
 if(state.page!=='visual')return;
 paint($('art'),state.plugin,false);document.querySelectorAll('.sample canvas').forEach((c,i)=>paint(c,i,true));
}
function selectPlugin(i){
 state.plugin=i;pickCover(i);const [cn,en,code]=plugins[i];$('art-cn').textContent=cn;$('art-en').innerHTML=en.split(' ').join('<br>');$('art-code').textContent=code+' / 0'+(i+1);
 $('art').setAttribute('aria-label',cn+'实时图形');
 document.querySelectorAll('.sample').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));redraw();
}
plugins.forEach(([cn,en],i)=>{const b=document.createElement('button');b.className='sample';b.innerHTML='<canvas aria-hidden="true"></canvas><span><b>'+cn+'</b><small>'+en+'</small></span>';b.onclick=()=>selectPlugin(i);$('samples').append(b)});
function updateInputs(){
 $('angle-val').textContent=$('angle').value+'°';$('density-val').textContent=$('density').value;$('poster').classList.toggle('grid',$('grid').checked);redraw()
}
['angle','density','grid'].forEach(id=>$(id).addEventListener('input',updateInputs));
let frame=0,last=0;
function run(t){
 frame=0;if(!$('motion').checked||state.page!=='visual'||document.hidden)return;
 if(!last)last=t;if(t-last>=48){state.phase+=Math.min(t-last,100)*.0007;last=t;paint($('art'),state.plugin,false)}
 frame=requestAnimationFrame(run);
}
function syncAnimation(){cancelAnimationFrame(frame);last=0;if($('motion').checked&&state.page==='visual'&&!document.hidden)frame=requestAnimationFrame(run)}
$('motion').onchange=syncAnimation;document.addEventListener('visibilitychange',syncAnimation);reduced.addEventListener('change',()=>{if(reduced.matches){$('motion').checked=false;syncAnimation()}});
$('reset').onclick=()=>{$('density').value=44;$('angle').value=-12;$('grid').checked=false;$('motion').checked=false;state.palette=0;state.phase=0;syncAnimation();applyTheme();updateInputs()};
$('theme').onclick=()=>{state.dark=!state.dark;applyTheme()};
function scene(id,title,canvas,inspectorTitle,inspector){
 $(id).innerHTML='<div class="layout"><div class="stage borderbox"><div class="bar"><span class="bar-label"><i class="dot"></i>'+title+'</span><span>交互预览</span></div><div class="demo">'+canvas+'</div></div><aside class="panel borderbox"><h2>'+inspectorTitle+'</h2><div class="rule"></div>'+inspector+'</aside></div>';
}
scene('controls','表单与反馈',
 '<form id="notify-form" class="form-block"><h2 class="scene-title">通知设置</h2><div class="field"><label for="email">接收邮箱</label><input type="email" id="email" required value="studio@example.com" aria-describedby="email-hint"><span class="hint" id="email-hint">用于接收项目更新，可用示例邮箱试填</span></div><label class="switchline">接收项目更新<input type="checkbox" class="toggle" id="enabled" checked></label><div class="field"><label for="frequency">发送频率</label><select id="frequency"><option>每日摘要</option><option>每周汇总</option><option>每次更新</option></select></div><div><button class="solid">保存设置</button></div><span id="saved" role="status" class="feedback"></span></form>',
 '控件状态','<div class="field"><label for="form-state">模拟数据</label><select id="form-state"><option value="normal">已有设置</option><option value="blank">空白输入</option><option value="error">格式错误</option></select></div><p class="hint">更改邮箱或发送频率，保存时可体验校验、确认弹窗和行内反馈</p><div class="rule"></div><div class="field"><span class="row-label">已生效设置</span><p class="hint" id="active-setting"></p></div>');
const initialEmail='studio@example.com';
let applied={enabled:true,email:initialEmail,frequency:'每日摘要'};
function describe(settings){return settings.enabled?settings.frequency+' · '+settings.email:'已暂停项目通知'}
function syncForm(){
 const on=$('enabled').checked;$('frequency').disabled=!on;$('email').disabled=!on;
 const invalid=on&&$('email').value!==''&&!$('email').validity.valid;
 $('email').setAttribute('aria-invalid',String(invalid));$('email').classList.toggle('invalid',invalid);
 $('email-hint').textContent=invalid?'请填写完整邮箱，如 studio@example.com':'用于接收项目更新，可用示例邮箱试填';
 $('active-setting').textContent=describe(applied);
 $('preview-enable').checked=on;$('preview-frequency').disabled=!on;$('preview-frequency').value=$('frequency').value;
}
$('notify-form').oninput=()=>{$('saved').textContent='';syncForm()};
$('form-state').onchange=()=>{const value=$('form-state').value;$('enabled').checked=true;$('email').value=value==='blank'?'':value==='error'?'studio@':initialEmail;$('saved').textContent='';syncForm()};
$('notify-form').onsubmit=e=>{e.preventDefault();$('dialog-copy').textContent=describe({enabled:$('enabled').checked,email:$('email').value,frequency:$('frequency').value});$('confirm').returnValue='';$('confirm').showModal()};
$('confirm').onclose=()=>{if($('confirm').returnValue==='confirm'){applied={enabled:$('enabled').checked,email:$('email').value,frequency:$('frequency').value};syncForm();$('saved').textContent='通知设置已保存到本次演示'}};
scene('colors','语义配色',
 '<h2 class="scene-title" id="palette-name"></h2><div class="color-strip" id="strip"></div><div class="summary"><i class="dot"></i><div><strong>24</strong><p>已归档的设计样本</p></div></div><div class="line"><button id="pin" aria-pressed="false" class="solid">收藏样本</button><span class="hint" id="pin-status" role="status"></span></div>',
 '配色设置','<fieldset><legend>色彩方案</legend><div class="swatches" id="theme-swatches"></div></fieldset><label class="switchline">深色背景<input id="dark-switch" type="checkbox" class="toggle"></label><div class="rule"></div><p class="hint">切换后，按钮、选中态和文字会一起更新，色带显示当前界面的实际色值</p>');
function renderTokens(){
 const style=getComputedStyle(document.documentElement);
 const roles=[['页面底','bg'],['表面','paper'],['浅强调','tint'],['强调','accent'],['正文','ink']];
 $('strip').replaceChildren(...roles.map(([name,key])=>{const el=document.createElement('div'),raw=style.getPropertyValue('--'+key).trim();
 const hex=raw.length===4?'#'+[...raw.slice(1)].map(ch=>ch+ch).join(''):raw;el.style.background=hex;
 const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);
 el.style.color=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.18?'#111':'#FFF';
 el.innerHTML='<span>'+name+'<br><span class="mono">'+hex.toUpperCase()+'</span></span>';return el}));
 $('palette-name').textContent=palettes[state.palette].name+' / '+(state.dark?'深色':'浅色');$('dark-switch').checked=state.dark;
}
$('dark-switch').onchange=()=>{state.dark=$('dark-switch').checked;applyTheme()};
$('pin').onclick=()=>{const on=$('pin').getAttribute('aria-pressed')!=='true';$('pin').setAttribute('aria-pressed',String(on));$('pin').textContent=on?'取消收藏':'收藏样本';$('pin-status').textContent=on?'样本已收藏':'已取消收藏'};
scene('patterns','界面模式','<div class="field"><h2 class="scene-title" id="pattern-title"></h2><p id="pattern-hint"></p></div><div id="pattern-body"></div>',
 '切换样本','<div id="pattern-choices" class="choices"></div><div class="rule"></div><p class="hint" id="pattern-note"></p>');
const patterns=[
 ['主从详情','点击一条结论，核对对应的访谈原话','结论与证据共享编号，切换记录时保留列表位置'],
 ['筛选与空态','按文档名称查找归档记录','搜索条件与反馈放在同一块区域，空结果提供清除入口'],
 ['分步流程','从资料收集走到结论核实','每一步使用同一份资料，最后一步保留来源关系']
];
const records=[
 ['检索入口需要常驻','“每次换了项目，我都要重新找搜索框”'],
 ['需要直接回到访谈原文','“我想点一下结论，就能看到当时那句话”'],
 ['导出时保留来源','“报告发出之后，同事还会问这段来自哪次访谈”']
];
function press(group,index){[...group.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(index===i)))}
function choice(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}
function pattern(index){
 const [title,hint,note]=patterns[index];$('pattern-title').textContent=title;$('pattern-hint').textContent=hint;$('pattern-note').textContent=note;press($('pattern-choices'),index);const body=$('pattern-body');
 if(index===0){
 body.innerHTML='<div class="list" id="records"></div><div class="detail" role="status" id="evidence"></div>';
 function select(i){press($('records'),i);$('evidence').textContent='访谈 0'+(i+1)+'　'+records[i][1]}
 records.forEach(([name],i)=>{const b=choice('',()=>select(i));b.className='record';b.innerHTML='<span>'+name+'</span><span>访谈 0'+(i+1)+'</span>';$('records').append(b)});select(0);
 }else if(index===1){
 body.innerHTML='<div class="field"><label for="filter">文档名称</label><input type="text" id="filter" placeholder="例如：访谈"><div class="list" id="results" role="status"></div><div><button class="outline" id="clear-filter" hidden>清除筛选</button></div></div>';
 function filter(){const query=$('filter').value.trim(),names=['访谈原始记录','可用性测试笔记','调研结论摘要'].filter(n=>n.includes(query));$('results').replaceChildren(...names.map(n=>{const row=document.createElement('div');row.className='record';row.textContent=n;return row}));if(!names.length)$('results').textContent='没有匹配的文档';$('clear-filter').hidden=!query}
 $('filter').oninput=filter;$('clear-filter').onclick=()=>{$('filter').value='';filter();$('filter').focus()};filter();
 }else{
 body.innerHTML='<div class="field"><div id="steps" class="seg"></div><div class="state" aria-live="polite"><b id="step-title"></b><p id="step-copy"></p></div><div class="line"><button class="outline" id="prev">上一步</button><button class="solid" id="next">下一步</button></div></div>';
 const steps=[['收集','已收录访谈 02','原话摘录　'+records[1][1]],['整理','提取待核实结论',records[1][0]],['核实','结论已关联访谈 02',records[1][0]+'　←　'+records[1][1]]];let current=0;
 function setStep(i){current=i;press($('steps'),i);$('step-title').textContent=steps[i][1];$('step-copy').textContent=steps[i][2];$('prev').disabled=!i;$('next').textContent=i===2?'重新演示':'下一步'}
 steps.forEach(([name],i)=>$('steps').append(choice(name,()=>setStep(i))));$('prev').onclick=()=>setStep(current-1);$('next').onclick=()=>setStep((current+1)%3);setStep(0);
 }
}
patterns.forEach(([name],i)=>$('pattern-choices').append(choice(name,()=>pattern(i))));
const pageCopy={
 overview:['界面样本室','选择一个样本，调整它的外观与行为'],
 visual:['视觉插件','用同一组参数比较折面、线条与网点'],
 controls:['基础控件','试填一份通知设置，查看校验、确认与保存反馈'],
 colors:['配色方案','在浅色与深色表面比较同一套语义色'],
 patterns:['界面模式','体验查看证据、筛选文档与分步核实']
};
let coverPlugin=1, previewRecord=1;
function openPage(id){
 state.page=id;document.querySelectorAll('.page').forEach(p=>p.hidden=p.id!==id);
 document.querySelectorAll('[data-page]').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.page===id)));
 $('page-heading').textContent=pageCopy[id][0];$('page-description').textContent=pageCopy[id][1];
 if(id==='visual')selectPlugin(coverPlugin);
 if(id==='patterns'){pattern(0);$('records').children[previewRecord].click()}
 redraw();syncAnimation();window.scrollTo(0,0);
}
document.querySelectorAll('[data-page],[data-open]').forEach(b=>b.onclick=()=>{
 openPage(b.dataset.page||b.dataset.open);
 if(b.dataset.open)document.querySelector('[data-page="'+state.page+'"]').focus({preventScroll:true});
});
function drawCover(){
 const fitResult=fit($('cover-art'));if(!fitResult)return;
 const {ctx,w,h}=fitResult, pal=palettes[state.palette];
 const scale=coverPlugin===1?Math.min(w*.34,h*.53):Math.min(w*.29,h*.36);
 ctx.save();ctx.translate(w*.54,h*.46);ctx.rotate(coverPlugin===1?-.22:-.23);ctx.scale(scale,scale);
 [folded,wave,halftone][coverPlugin](ctx,50,.25,pal.art);ctx.restore();
}
function pickCover(i){
 coverPlugin=i;
 $('cover-name').textContent=plugins[i][1];
 $('cover-art').setAttribute('aria-label',plugins[i][0]+'实时预览');
 press($('cover-picker'),i);drawCover();
}
plugins.forEach(([name],i)=>$('cover-picker').append(choice(['折面','波场','网点'][i],()=>pickCover(i))));
palettes.forEach((p,i)=>{
 const b=choice('',()=>{state.palette=i;applyTheme()});b.dataset.palette=i;b.className='plate';b.title='应用'+p.name+'配色';
 const field=document.createElement('i');field.style.background=p.art;field.style.setProperty('--light-tone',p.tint);field.style.setProperty('--deep-tone',p.light);
 const label=document.createElement('span');label.textContent=p.name;b.append(field,label);$('palette-plates').append(b);
});
function showQuote(i){
 previewRecord=i;press($('preview-index'),i);$('excerpt-source').textContent='访谈 0'+(i+1)+' · 原话摘录';
 $('excerpt-copy').textContent=records[i][1];
}
records.forEach(([name],i)=>$('preview-index').append(choice(name,()=>showQuote(i))));
$('preview-enable').onchange=()=>{$('enabled').checked=$('preview-enable').checked;$('enabled').dispatchEvent(new Event('input',{bubbles:true}))};
$('preview-frequency').onchange=()=>{$('frequency').value=$('preview-frequency').value;$('frequency').dispatchEvent(new Event('input',{bubbles:true}))};
showQuote(previewRecord);pickCover(coverPlugin);
new ResizeObserver(drawCover).observe($('cover-art'));
swatches($('art-swatches'));swatches($('theme-swatches'));
pattern(0);syncForm();selectPlugin(1);applyTheme();updateInputs();
new ResizeObserver(redraw).observe($('poster'));
</script>
